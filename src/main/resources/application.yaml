spring:
  application:
    name: fashion-commerce-backend

  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${DB_MIGRATIONS_ENABLED:false}
    locations: classpath:db/migration

  jackson:
    deserialization:
      fail-on-unknown-properties: true

security:
  jwt:
    issuer: ${JWT_ISSUER:fashion-commerce}
    secret-base64: ${JWT_SECRET_BASE64}
    access-ttl: ${JWT_ACCESS_TTL:15m}
  refresh-ttl: ${REFRESH_TOKEN_TTL:14d}
  cors-origins: ${CORS_ALLOWED_ORIGINS:}

assets:
  public-base-url: ${ASSET_PUBLIC_BASE_URL:}

auth:
  otp:
    ttl: ${OTP_TTL:5m}
    resend-cooldown: ${OTP_RESEND_COOLDOWN:60s}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    daily-send-limit: ${OTP_DAILY_SEND_LIMIT:10}
    # Use a different secret in production. JWT fallback only keeps local/test setup small.
    pepper-base64: ${OTP_PEPPER_BASE64:${JWT_SECRET_BASE64}}
  email:
    from: ${GMAIL_FROM:${GMAIL_USERNAME:}}

payments:
  online-reservation-ttl: ${PAYMENT_RESERVATION_TTL:15m}
  momo:
    enabled: ${MOMO_ENABLED:false}
    merchant-id: ${MOMO_PARTNER_CODE:}
    api-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
  zalopay:
    enabled: ${ZALOPAY_ENABLED:false}
    merchant-id: ${ZALOPAY_APP_ID:}
    api-key: ${ZALOPAY_KEY1:}
    secret-key: ${ZALOPAY_KEY2:}
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    merchant-id: ${VNPAY_TMN_CODE:}
    api-key: ${VNPAY_HASH_SECRET:}
    secret-key: ${VNPAY_HASH_SECRET:}

server:
  error:
    include-message: never
    include-stacktrace: never

# Framework DEBUG validation output may include rejected password values.
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.SQL: OFF
