spring:
  application:
    name: fashion-commerce-backend

  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${DB_MIGRATIONS_ENABLED:false}
    locations: classpath:db/migration

  jackson:
    deserialization:
      fail-on-unknown-properties: true

security:
  jwt:
    issuer: ${JWT_ISSUER:fashion-commerce}
    secret-base64: ${JWT_SECRET_BASE64}
    access-ttl: ${JWT_ACCESS_TTL:15m}
  refresh-ttl: ${REFRESH_TOKEN_TTL:14d}
  cors-origins: ${CORS_ALLOWED_ORIGINS:}

server:
  error:
    include-message: never
    include-stacktrace: never

# Framework DEBUG validation output may include rejected password values.
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.SQL: OFF
